<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Throtl - Launching Soon</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>
    
    <div class="mesh-background" id="meshBackground"></div>
    
    <div class="gradient-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    
    <div class="content">
        <div class="logo-container">
            <h1 class="brand-name">throtl<span class="brand-dot">.</span></h1>
        </div>
        
        <div class="main-text">
            <h2 class="launching-text">
                <span class="word">
                    <span class="letter">L</span>
                    <span class="letter">a</span>
                    <span class="letter">u</span>
                    <span class="letter">n</span>
                    <span class="letter">c</span>
                    <span class="letter">h</span>
                    <span class="letter">i</span>
                    <span class="letter">n</span>
                    <span class="letter">g</span>
                </span>
                <span class="word-break"></span>
                <span class="word">
                    <span class="letter">S</span>
                    <span class="letter">o</span>
                    <span class="letter">o</span>
                    <span class="letter">n</span>
                </span>
            </h2>
            <p class="subtitle">The ultimate motorcycle ride tracking experience</p>
        </div>
        
        <!-- Bottom action buttons (only X and Instagram) -->
        <div class="bottom-actions" role="navigation" aria-label="External links">
            <a href="https://x.com/ThrotlApp" target="_blank" rel="noopener noreferrer" class="action-btn" aria-label="Throtl on X">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" fill="currentColor"/>
                </svg>
            </a>

            <a href="https://www.instagram.com/throtl.app" target="_blank" rel="noopener noreferrer" class="action-btn" aria-label="Throtl on Instagram">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="currentColor" stroke-width="2" fill="none"/>
                    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
                    <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor"/>
                </svg>
            </a>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
